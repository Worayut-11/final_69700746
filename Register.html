<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Go2upSkills</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="menu"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <h2 class="text-center mb-4">Register</h2>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="fullName" required>
            <div class="invalid-feedback">กรุณากรอกชื่อ-นามสกุล</div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" required>
            <div class="invalid-feedback">กรุณากรอกอีเมลให้ถูกต้อง</div>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone" pattern="[0-9]{9,10}" required>
            <div class="invalid-feedback">กรุณากรอกเบอร์โทร 9–10 หลัก (ตัวเลขเท่านั้น)</div>
          </div>

          <div class="mb-3">
            <label for="course" class="form-label">Select Course</label>
            <select class="form-select" id="course" required>
              <option value="" selected disabled></option>
              <option>Course 1 - Web Development</option>
              <option>Course 2 - Python Programming</option>
              <option>Course 3 - Power BI</option>
              <option>Course 4 - Web Development</option>
              <option>Course 5 - Python Programming</option>
              <option>Course 6 - Power BI</option>
            </select>
            <div class="invalid-feedback">กรุณาเลือกคอร์ส</div>
          </div>

          <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <div id="successMsg" class="alert alert-success mt-4 d-none"></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
